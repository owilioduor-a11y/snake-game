<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        /* Prevent unwanted text zooming on mobile */
        @media screen and (max-width: 768px) {
            * {
                -webkit-text-size-adjust: none;
                text-size-adjust: none;
            }
        }
    </style>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2d2d44">
    <title>Snake Game - Playing</title>
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="game-data.js" as="script">
    <link rel="preload" href="game.js" as="script">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="game-page">
        <nav class="game-nav">
            <div class="nav-section">
                <button class="back-btn" onclick="goToStart()">← Back</button>
            </div>
            <div class="nav-section">
                <div class="score-display">
                    <span>Score: <span id="score">0</span></span>
                    <span class="high-score">High: <span id="highScore">0</span></span>
                    <span class="combo-display">Combo: <span id="combo">0</span>x</span>
                </div>
            </div>
            <div class="nav-section">
                <button id="pauseBtn" class="pause-btn" onclick="togglePause()">⏸️ Pause</button>
                <button id="soundToggle" class="sound-toggle" onclick="toggleSound()">🔊</button>
            </div>
        </nav>
        <div id="gameContainer">
            <canvas id="gameCanvas"></canvas>
            <div id="instructions">
                Click/tap or swipe to control the snake • Eat red food to grow • Avoid walls and yourself
            </div>
            <div id="mobileControls" class="dpad-container">
                <button type="button" class="dpad-btn up" id="btnUp" aria-label="Move up">▲</button>
                <div class="dpad-middle-row">
                    <button type="button" class="dpad-btn left" id="btnLeft" aria-label="Move left">◀</button>
                    <button type="button" class="dpad-btn right" id="btnRight" aria-label="Move right">▶</button>
                </div>
                <button type="button" class="dpad-btn down" id="btnDown" aria-label="Move down">▼</button>
            </div>
        </div>
        <div id="sizeReductionNotification">
            <h3>🎉 Congratulations!</h3>
            <p>You've reached 250 points! Snake size reduced to continue the challenge.</p>
        </div>
    </div>
    <script src="game-data.js"></script>
    <script src="game.js"></script>
</body>
</html>
